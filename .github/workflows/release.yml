# Build the desktop app on native runners and publish a GitHub Release.
#
# The six-target matrix in `docs/10-release-and-updates.md` is the full plan;
# this workflow ships the three targets that cover the most users without two
# extra billed runners (macOS is 10x the minutes, Windows 2x, Linux 1x):
#
#   windows-2025   x86_64-pc-windows-msvc   restbook-<v>-windows-x86_64.exe
#   macos-26       aarch64-apple-darwin     restbook-<v>-macos-aarch64.dmg
#   ubuntu-22.04   x86_64-unknown-linux-gnu restbook-<v>-linux-x86_64.deb
#                                          restbook-<v>-linux-x86_64-portable.tar.gz
#
# The manifest maps one URL per platform, so only one asset per platform can
# carry that platform's key; Linux's portable tarball is renamed `-portable`
# to stay reachable without colliding with the `.deb`'s `linux-x86_64` key.
#
# Adding a target is one matrix entry plus, if its packaging differs, one step.
# The `windows-11-arm` and `ubuntu-24.04-arm` entries from the docs are left out
# on purpose: both are still the least stable runner labels, and neither has a
# user base this app can justify yet.
#
# Nothing here is cross-compiled. GPUI needs the target's own X11/Wayland/
# fontconfig headers on Linux, Apple's SDK on macOS, and the MSVC linker plus
# the Windows SDK's `fxc.exe` for a release profile on Windows (see
# `docs/10-release-and-updates.md`, "Artifact matrix").
#
#   push a tag         the only manual step: `git push origin 0.1.0`
#   workflow_dispatch  re-release an existing tag; `dry_run` builds only
#
# A release is published only after every build job succeeded, and as a draft
# until the manifest is attached, so a failed matrix leaves nothing public.

name: Release

on:
  push:
    tags:
      # Bare semver: `0.1.0`. `docs/10` owns the convention, and `verify` rejects
      # a tag whose version carries a prerelease suffix — there is one channel.
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build only; create and publish nothing"
        required: false
        type: boolean
        default: false

# A release is not cancelled halfway by a newer push; a re-run resumes it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # A release build wants reproducible, non-incremental artifacts.
  CARGO_INCREMENTAL: "0"
  # Both `rust-toolchain.toml` files pin `stable-x86_64-pc-windows-gnu`, which
  # does not exist on the Linux or macOS runners. The environment variable
  # overrides the toolchain file, so every job runs plain `stable`.
  RUSTUP_TOOLCHAIN: stable
  RUST_BACKTRACE: "1"

jobs:
  # Tag, version, and ancestry, before a single runner is paid for.
  verify:
    name: Verify tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Reading the commit's check runs is how the release learns whether CI
      # passed; it does not run the suite itself.
      checks: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A tag push checks out that tag; a manual run checks out the tag it
          # was given instead of the branch the button was pressed on.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - id: meta
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/app/Cargo.toml | head -n 1)
          engine=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)

          echo "tag: $tag" >&2
          echo "app version: $version" >&2
          echo "engine version: $engine" >&2

          if [ -z "$version" ] || [ -z "$engine" ]; then
            echo "::error::could not read a version from Cargo.toml" >&2
            exit 1
          fi

          # The tag is the release identity: it must equal the app's version,
          # which is what `updater::CURRENT_VERSION` advertises.
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match crates/app version $version" >&2
            exit 1
          fi
          if [ "$engine" != "$version" ]; then
            echo "::error::engine version $engine does not match app version $version" >&2
            exit 1
          fi

          # A tag on an unmerged commit is a build nobody can reproduce.
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${tag}^{commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::tag $tag is not on ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

          # One channel. A prerelease suffix used to select the beta channel;
          # there is no beta channel any more, and a `-beta.1` tag would either
          # publish something `releases/latest` never serves (the updater's only
          # URL) or quietly take the `latest` marker away from a real release.
          # Refuse the tag instead of guessing which was meant.
          case "$version" in
            *-*)
              echo "::error::version $version carries a prerelease suffix; releases are stable only (docs/09)" >&2
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The verdict on this commit comes from `ci.yml`, not from a second copy of
      # its checks running here. Rebuilding the suite cost 21 minutes per release
      # and a fourth multi-gigabyte cache entry, for exactly the answers CI had
      # already produced for this SHA.
      #
      # A missing result is a failure, not a pass: it means this commit never went
      # through CI, which is the case a release must refuse. Tag after CI is green
      # (the tag push does not wait for it).
      - name: CI is green for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          sha=$(git rev-parse "${TAG}^{commit}")
          echo "checking ci.yml results for $sha" >&2

          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100&filter=latest" \
            --jq '.check_runs[] | "\(.name) \(.status) \(.conclusion)"' > results.txt
          sed 's/^/  /' results.txt >&2

          failed=0
          for job in Lint Clippy Test "Encrypted store"; do
            # The name is matched as a whole prefix, not as `$1`: a job name may
            # contain a space ("Encrypted store"), and comparing only the first
            # field made that job impossible to satisfy.
            result=$(grep -F -m 1 "${job} completed " results.txt || true)
            if [ "$result" = "${job} completed success" ]; then
              continue
            fi
            if [ -z "$result" ]; then
              echo "::error::$job never ran for $sha; push it and wait for CI before tagging" >&2
            else
              echo "::error::$job is not green for $sha: $result" >&2
            fi
            failed=1
          done
          exit "$failed"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64: MSVC, so the icon and version block from
          # `crates/app/build.rs` survive (GNU `ld` drops `.rsrc`).
          - os: windows-2025
            platform: windows-x86_64
          # macOS on Apple silicon: `scripts/package.sh` produces the `.app`
          # bundle and the drag-to-Applications `.dmg` around it.
          - os: macos-26
            platform: macos-aarch64
          # The oldest image the app supports: glibc is versioned at link
          # time, so a 24.04 build fails on 22.04 with `GLIBC_2.39 not found`.
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      # Read by `updater::RELEASE_REPO` at compile time, so the binary polls the
      # repository it was built from rather than a hard-coded owner.
      RESTBOOK_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The app is its own workspace with its own lockfile, so the cache has
      # to be told about `crates/app` rather than assuming the root.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "crates/app -> target"
          key: ${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-xinput-dev libxcb-render0-dev libxcb-sync-dev \
            libxcb-present-dev libxcb-damage0-dev libxcb-composite0-dev \
            libfontconfig1-dev libfreetype6-dev libzstd-dev

      # The Windows build links OpenSSL statically (`--vendored`), so there is no
      # OpenSSL tree to install and no DLL to ship beside the exe: `openssl-src`
      # compiles its own copy with the app. What it does need is OpenSSL's own
      # `Configure`, which means a **native Windows** Perl with an intact core:
      # Git Bash puts Cygwin's perl first on PATH (`x86_64-cygwin-thread-multi`),
      # it is missing `ExtUtils::MakeMaker`, and OpenSSL rejects that flavour for
      # an MSVC target anyway. `openssl-src` reads `OPENSSL_SRC_PERL` before PATH,
      # so pointing it at Strawberry Perl is the whole fix — and doing it here
      # fails in seconds instead of after a five-minute C compile.
      - name: Install Perl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Strawberry\perl\bin\perl.exe',
            "$env:ProgramFiles\Strawberry\perl\bin\perl.exe",
            'C:\Perl64\bin\perl.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }

          $perl = $candidates | Select-Object -First 1
          if (-not $perl) {
            choco install strawberryperl --no-progress -y
            $perl = 'C:\Strawberry\perl\bin\perl.exe'
          }
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Strawberry Perl was not found at $perl"
          }

          & $perl --version | Select-Object -Skip 1 -First 1
          & $perl -MExtUtils::MakeMaker -e 'print "perl modules: ok"'
          if ($LASTEXITCODE -ne 0) {
            throw "$perl cannot load ExtUtils::MakeMaker"
          }

          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Split-Path -Parent $perl) | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "OPENSSL_SRC_PERL=$perl"

      # One packaging script for every OS; it already knows each one's shape.
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # `package.sh` compiles `crates/app/packaging/restbook.iss` with ISCC,
          # which turns the exe and the libcrypto DLL into one installer.
          #
          # The official installer is pinned and checksummed instead of coming
          # from `choco`: the package's install directory moves between versions,
          # and when its PATH shim resolves to nothing the only thing a failed
          # run reports is "The system cannot find the file specified." — no
          # compiler output, no path. `/PORTABLE=1` unpacks the compiler under
          # `RUNNER_TEMP` with no admin rights, and `ISCC_PATH` is what
          # `package.sh` looks for first.
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe'
          $expected = '5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'innosetup'

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Unexpected Inno Setup checksum: $actual"
          }

          $arguments = "/SP- /CURRENTUSER /DIR=`"$directory`" /NORESTART /PORTABLE=1 /SUPPRESSMSGBOXES /VERYSILENT"
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Could not install Inno Setup: exit code $($process.ExitCode)"
          }

          $iscc = Join-Path $directory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not installed at $iscc"
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ISCC_PATH=$iscc"

      - name: Package
        shell: bash
        run: |
          # Windows links OpenSSL statically, so its installer carries one file
          # and needs no crypto DLL at all. Linux builds without SQLCipher and
          # macOS takes its crypto from the system, so neither wants the flag.
          if [ "$RUNNER_OS" = "Windows" ]; then
            bash scripts/package.sh --release --vendored
          else
            bash scripts/package.sh --release
          fi

      - name: Collect Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # One file: the installer carries restbook.exe — with OpenSSL linked
          # in — plus the Start-menu entry and the taskbar identity. Its name
          # already matches the release's spelling.
          installer="dist/restbook-${VERSION}-${PLATFORM}.exe"
          if [ ! -f "$installer" ]; then
            echo "::error::$installer was not built; see the Package step's ISCC output" >&2
            exit 1
          fi
          cp "$installer" out/
          ls -l out

      - name: Collect macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # `package.sh` builds the disk image and its drag-to-Applications
          # layout, so the copy here is all that is left to do.
          dmg="dist/restbook-${VERSION}-${PLATFORM}.dmg"
          if [ ! -f "$dmg" ]; then
            echo "::error::$dmg was not built; see the Package step's output" >&2
            exit 1
          fi
          cp "$dmg" out/

      - name: Collect Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # Two assets ship, but the manifest holds one URL per platform key.
          # The `.deb` is the installable one, so it gets the `linux-x86_64`
          # key; the portable tarball is renamed `-portable` so its key
          # (`linux-x86_64-portable`) does not overwrite it. That keeps the
          # tarball downloadable for people not on a Debian-based distro.
          deb="dist/restbook-${VERSION}-${PLATFORM}.deb"
          if [ ! -f "$deb" ]; then
            echo "::error::$deb was not built; see the Package step's output" >&2
            exit 1
          fi
          cp "$deb" out/

          # `package.sh` names the tarball `restbook-<v>-linux-<arch>.tar.gz`;
          # the copy pins the release's spelling regardless of `uname -m`.
          tarball=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tarball"
          cp "$tarball" "out/restbook-${VERSION}-${PLATFORM}-portable.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # The only job that writes: it assembles the assets, writes the channel
  # manifest from their own checksums, and publishes the draft. A build job
  # cannot touch the release, so a partially failed matrix has nothing to undo.
  publish:
    name: Publish release
    needs: [verify, build]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      # `gh release create --verify-tag` shells out to git for the tag, so the
      # checkout has to exist; `fetch-depth: 0` is what gives it the tag
      # history a re-run resumes against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail

          # Resolve before `cd release`: the body comes from the checkout, not
          # from the artifact directory.
          changelog="$GITHUB_WORKSPACE/CHANGELOG.md"

          cd release
          ls -l

          # The body says what changed for the user, and the only record of that
          # is the changelog's own section for this version. The commit range is
          # used below for who and which pull requests, never for the changes
          # themselves: it lists refactors and CI work a user never sees.
          if [ ! -f "$changelog" ]; then
            echo "::error::CHANGELOG.md not found; a release cannot ship with no description" >&2
            exit 1
          fi
          notes=$(awk -v want="$VERSION" '
            /^## / {
              heading = $0
              sub(/^## */, "", heading)
              in_section = (heading == want)
              found = found || in_section
              next
            }
            in_section { print }
            END { if (!found) exit 3 }
          ' "$changelog") || {
            echo "::error::CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          }
          notes=$(printf '%s\n' "$notes" | sed '/^[[:space:]]*$/d')
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md's '## $VERSION' section is empty" >&2
            exit 1
          fi

          # The page lists one line per pull request merged since the previous
          # tag: what changed, its kind, who sent it, and the PR number. With no
          # previous tag there is no range to summarise, so the page falls back
          # to the changelog entry.
          body=$notes
          previous=$(git describe --tags --abbrev=0 --exclude "$TAG" "refs/tags/$TAG" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="refs/tags/$previous..refs/tags/$TAG"
            items=""
            for n in $(git log "$range" --merges --format='%s' \
              | sed -n 's/^Merge pull request #\([0-9][0-9]*\).*/\1/p' | sort -n); do
              title=$(gh pr view "$n" --json title -q .title 2>/dev/null) || continue
              author=$(gh pr view "$n" --json author -q .author.login 2>/dev/null) || continue

              kind=change
              detail=$title
              conventional='^([A-Za-z]+)(\([^)]*\))?:[[:space:]]*(.*)$'
              branchy='^([A-Za-z]+)/(.*)$'
              if [[ $title =~ $conventional ]]; then
                kind=${BASH_REMATCH[1],,}
                detail=${BASH_REMATCH[3]}
              elif [[ $title =~ $branchy ]]; then
                kind=${BASH_REMATCH[1],,}
                detail=${BASH_REMATCH[2]}
              fi
              detail="${detail^}"
              items+="- $detail ($kind) by @$author #$n"$'\n'
            done

            if [ -n "$items" ]; then
              body=$(printf "## What's New\n\n%s" "$items")
            fi
          fi

          # One release per tag; a re-run resumes the draft instead of
          # duplicating it. An existing release is left in whatever
          # draft/published state it has: GitHub refuses to turn a published
          # release back into a draft.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; updating it"
            gh release edit "$TAG" --notes "$body"
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "restbook $VERSION" --notes "$body"
          fi

          # The manifest is derived, never hand-written: the URL follows the
          # repository and tag, and the checksum is computed from the bytes
          # about to be uploaded. Its `notes` is the changelog entry alone — the
          # update dialog is not the place for a contributor list or PR links.
          assets='{}'
          # Only the package artifacts define the manifest. Anything else that
          # happens to be in this directory (release notes, a stray debug log)
          # must never become an asset key.
          for file in restbook-*; do
            [ -f "$file" ] || continue
            rest=${file#"restbook-${VERSION}-"}
            # One key per platform, so `.deb` must be stripped to give Linux the
            # `linux-x86_64` key; `.tar.gz` is stripped as a unit, and the
            # portable tarball keeps its suffix, yielding `linux-x86_64-portable`.
            key=${rest%.zip}; key=${key%.dmg}; key=${key%.deb}
            key=${key%.tar.gz}; key=${key%.exe}
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            url="https://github.com/${REPO}/releases/download/${TAG}/${file}"
            assets=$(jq --arg k "$key" --arg u "$url" --arg s "$sha" \
              '. + {($k): {url: $u, sha256: $s}}' <<<"$assets")
          done

          manifest=latest.json
          # `notes` here is the changelog entry alone: the in-app update dialog
          # says what changed in the user's words, while the release page lists
          # the pull requests.
          jq -n --arg version "$VERSION" --arg notes "$notes" --argjson assets "$assets" \
            '{version: $version, notes: $notes, assets: $assets}' > "$manifest"
          cat "$manifest"

          gh release upload "$TAG" latest.json restbook-* --clobber

          # Only now is anything visible: the draft becomes the release and takes
          # the `latest` marker, which is what `releases/latest` — and so the
          # updater's only URL — resolves.
          gh release edit "$TAG" --draft=false --latest
