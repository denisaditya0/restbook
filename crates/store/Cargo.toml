[package]
name = "restbook-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Encrypted history. Enabling this builds SQLCipher from source (needs a C
# toolchain and a few minutes on first build) and links libcrypto
# dynamically, so `OPENSSL_DIR` has to point at an OpenSSL tree.
sqlcipher = ["dep:base64", "dep:chrono", "dep:keyring", "dep:rand", "dep:rusqlite"]
# The same store, but OpenSSL is compiled with the crate and linked
# statically: no `OPENSSL_DIR`, no `libcrypto` beside the executable, nothing
# for a loader to fail to find. Needs a complete `perl` on the build machine
# (`openssl-src` drives OpenSSL's own Configure), so it is opt-in — the
# release build turns it on, local development does not.
sqlcipher-vendored = ["sqlcipher", "rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
restbook-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# The facade only; the app installs the sink. A skipped collection or
# environment is a line in `<data dir>/restbook.log`, not a lost console write.
log = "0.4"

base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
# `bundled-sqlcipher` compiles SQLCipher and links libcrypto dynamically: the
# OpenSSL tree comes from `OPENSSL_DIR` (see `scripts/dev.sh`) and the matching
# DLL ships beside the exe. The `sqlcipher-vendored` feature switches that to a
# static build instead — see the feature list above and
# `docs/05-cross-platform.md`.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher"], optional = true }

# The OS credential store. keyring 3 has no default backend, and without one it
# silently `pub use mock` — an in-memory store. The master key would then change
# on every launch, so the encrypted history would be unreadable the next time
# the app started. Each platform has to opt in explicitly.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
# Tests build without the `sqlcipher` feature, where `chrono` is optional.
chrono.workspace = true
